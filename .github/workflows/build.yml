name: build-native

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32-x64
            runner: windows-latest
            target_os: windows
            target_arch: amd64
          - name: linux-x64
            runner: ubuntu-24.04
            target_os: linux
            target_arch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target_os: linux
            target_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned garble
        shell: bash
        run: |
          go install mvdan.cc/garble@v0.15.0
          garble version
      - name: Fetch pinned sing-box source
        shell: bash
        run: ./scripts/fetch-upstream.sh
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mingw --no-progress -y
      - name: Build
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: ./scripts/build.sh
      - name: Build Node-API addon
        shell: bash
        run: npx --yes node-gyp rebuild --directory addon
      - name: Copy Node-API addon into artifact
        shell: bash
        run: cp addon/build/Release/leme_native.node dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/leme_native.node
      - name: Run Linux C ABI lifecycle smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          gcc tests/smoke.c \
            -I dist/${{ matrix.target_os }}-${{ matrix.target_arch }} \
            -L dist/${{ matrix.target_os }}-${{ matrix.target_arch }} \
            -Wl,-rpath,"$PWD/dist/${{ matrix.target_os }}-${{ matrix.target_arch }}" \
            -l:libleme-singbox.so \
            -o dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/smoke
          dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/smoke
      - name: Run Windows C ABI lifecycle smoke test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          gcc tests/smoke.c \
            -I dist/windows-amd64 \
            -L dist/windows-amd64 \
            -lleme-singbox \
            -o dist/windows-amd64/smoke.exe
          cp dist/windows-amd64/leme-singbox.dll .
          dist/windows-amd64/smoke.exe
      - name: Inspect Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/libleme-singbox.so
          readelf -h dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/libleme-singbox.so
          nm -D --defined-only dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/libleme-singbox.so | grep leme_core_
      - name: Inspect Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: objdump -p dist/windows-amd64/leme-singbox.dll | grep leme_core_
      - uses: actions/upload-artifact@v4
        with:
          name: leme-singbox-${{ matrix.name }}
          path: dist/${{ matrix.target_os }}-${{ matrix.target_arch }}/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: leme-singbox-win32-x64
          path: release/win32-x64

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: leme-singbox-linux-x64
          path: release/linux-x64

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: leme-singbox-linux-arm64
          path: release/linux-arm64

      - name: Prepare direct release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/packages
          cp release/win32-x64/leme-singbox.dll release/packages/leme-singbox-win32-x64.dll
          cp release/win32-x64/leme-singbox.h release/packages/leme-singbox-win32-x64.h
          cp release/win32-x64/leme_native.node release/packages/leme-native-win32-x64.node
          cp release/linux-x64/libleme-singbox.so release/packages/libleme-singbox-linux-x64.so
          cp release/linux-x64/leme-singbox.h release/packages/leme-singbox-linux-x64.h
          cp release/linux-x64/leme_native.node release/packages/leme-native-linux-x64.node
          cp release/linux-arm64/libleme-singbox.so release/packages/libleme-singbox-linux-arm64.so
          cp release/linux-arm64/leme-singbox.h release/packages/leme-singbox-linux-arm64.h
          cp release/linux-arm64/leme_native.node release/packages/leme-native-linux-arm64.node

      - name: Generate manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp versions.json release/packages/manifest.json
          (
            cd release/packages
            sha256sum \
              leme-singbox-win32-x64.dll \
              leme-singbox-win32-x64.h \
              leme-native-win32-x64.node \
              libleme-singbox-linux-x64.so \
              leme-singbox-linux-x64.h \
              leme-native-linux-x64.node \
              libleme-singbox-linux-arm64.so \
              leme-singbox-linux-arm64.h \
              leme-native-linux-arm64.node \
              manifest.json > checksums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Leme sing-box Native ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/packages/leme-singbox-win32-x64.dll
            release/packages/leme-singbox-win32-x64.h
            release/packages/leme-native-win32-x64.node
            release/packages/libleme-singbox-linux-x64.so
            release/packages/leme-singbox-linux-x64.h
            release/packages/leme-native-linux-x64.node
            release/packages/libleme-singbox-linux-arm64.so
            release/packages/leme-singbox-linux-arm64.h
            release/packages/leme-native-linux-arm64.node
            release/packages/checksums.txt
            release/packages/manifest.json
